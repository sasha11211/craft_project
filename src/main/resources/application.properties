spring.application.name=users-service

spring.data.mongodb.uri=${MONGODB_URI}
server.error.include-message=always

#Indexed MongoDB
spring.data.mongodb.auto-index-creation: true

#JWT

security.jwt.access-token-expiration-ms=300000

security.jwt.refresh-token-expiration-ms=600000
security.jwt.secret=${JWT_SECRET}

# Render
server.port=${PORT:8080}

# Actuator (health)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

#Jackson
spring.jackson.mapper.accept-case-insensitive-enums=true
# AWS S3 file storage
file.storage.s3.region=${AWS_REGION}
file.storage.s3.bucket=${AWS_S3_BUCKET}
file.storage.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
file.storage.s3.max-file-size-mb=${AWS_S3_MAX_FILE_SIZE_MB:10}
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are read by the AWS SDK default credentials provider chain.
